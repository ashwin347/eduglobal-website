<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colleges | Eduglobal International</title>
<link rel="icon" href="images/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#95001D}a:hover{color:#0F2A66}
@media (max-width: 1080px){.eg-desk-nav{display:none !important}.eg-burger{display:flex !important}}

@media (max-width: 760px){.eg-topbar{display:none !important}.eg-header-row{padding:10px 16px !important;flex-wrap:nowrap !important}.eg-logo{height:36px !important}.eg-brand{font-size:16px !important}.eg-brand-2{display:block}.eg-tagline{display:none !important}.eg-hero-img{height:220px !important;flex-basis:100% !important}.eg-tall-img{height:260px !important}.eg-form{grid-template-columns:1fr !important;padding:22px !important;max-height:calc(100vh - 32px);overflow-y:auto}.eg-form > *{grid-column:1 / -1 !important}.eg-quote{padding:24px 18px !important}.eg-tcar{gap:8px !important}.eg-subnav{top:64px !important}.eg-subnav-row{flex-wrap:nowrap !important;overflow-x:auto;gap:22px !important;padding:0 16px !important}.eg-subnav-row a{white-space:nowrap;flex:none}.eg-aside{position:static !important}}
</style>

<body>
<div id="app"></div>
<template id="tpl">

<div class="eg-topbar" style="background: #0F2A66; color: #D5DDF0; font-size: 14px">

<div style="display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center">

<a href="mailto:info@example.com" style="color: #FFFFFF; text-decoration: none">[info@youragency.com]</a>
<span style="display: flex; gap: 14px"><a href="#" style="color: #FFFFFF; text-decoration: none">Facebook</a><a href="#" style="color: #FFFFFF; text-decoration: none">Instagram</a><a href="#" style="color: #FFFFFF; text-decoration: none">YouTube</a></span>

</div>
</div>

<header style="background: #FFFFFF; box-shadow: 0 2px 12px rgba(15,42,102,0.08); position: sticky; top: 0; z-index: 20">
<div class="eg-header-row" style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
<a href="index.html" style="display: flex; align-items: center; gap: 12px; color: #1B2440; text-decoration: none">
<img src="images/logo-mark.png" alt="" class="eg-logo" style="height: 44px; width: auto; display: block">
<span style="display: flex; flex-direction: column; line-height: 1.1"><span class="eg-brand" style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.02em; color: #95001D">EDUGLOBAL <span class="eg-brand-2" style="color: #1B2440">INTERNATIONAL</span></span><span class="eg-tagline" style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #45506B; font-weight: 700">Study in India and Abroad</span></span>
</a>
<nav aria-label="Main" class="eg-desk-nav" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 26px; font-size: 16px; font-weight: 600">
<a href="index.html" style="color: #1B2440; text-decoration: none; padding: 8px 0; border-bottom: 2px solid transparent">Home</a>
<a href="colleges.html" aria-current="page" style="color: #95001D; text-decoration: none; padding: 8px 0; border-bottom: 2px solid #95001D">Colleges</a>
<a href="courses.html" style="color: #1B2440; text-decoration: none; padding: 8px 0; border-bottom: 2px solid transparent">Find a Course</a>

<a href="services.html" style="color: #1B2440; text-decoration: none; padding: 8px 0; border-bottom: 2px solid transparent">Our Services</a>
<button type="button" onClick="{{openEnquiry}}" style="font: inherit; font-weight: 700; color: #FFFFFF; background: #95001D; border: 0; padding: 12px 22px; border-radius: 6px; cursor: pointer">Apply Now</button>
</nav>
<button type="button" class="eg-burger" onClick="{{toggleMenu}}" aria-label="Open menu" aria-expanded="{{menuExpanded}}" style="display: none; flex: none; width: 44px; height: 44px; border-radius: 8px; border: 1px solid #C9D3EA; background: #FFFFFF; color: #0F2A66; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7 H20 M4 12 H20 M4 17 H20"></path></svg></button>
</div>
<sc-if value="{{showMenu}}" hint-placeholder-val="{{false}}">
<nav aria-label="Mobile" class="eg-mobile-menu" style="border-top: 1px solid #E1E7F3; background: #FFFFFF; padding: 4px 16px 18px; display: flex; flex-direction: column; font-size: 17px; font-weight: 700">
<a href="index.html" style="padding: 14px 4px; border-bottom: 1px solid #E1E7F3; color: #1B2440; text-decoration: none">Home</a>
<a href="colleges.html" style="padding: 14px 4px; border-bottom: 1px solid #E1E7F3; color: #1B2440; text-decoration: none">Colleges</a>
<a href="courses.html" style="padding: 14px 4px; border-bottom: 1px solid #E1E7F3; color: #1B2440; text-decoration: none">Find a Course</a>
<a href="about.html" style="padding: 14px 4px; border-bottom: 1px solid #E1E7F3; color: #1B2440; text-decoration: none">About Us</a>
<a href="services.html" style="padding: 14px 4px; border-bottom: 1px solid #E1E7F3; color: #1B2440; text-decoration: none">Our Services</a>

</nav>

</header>

<section style="background: #0F2A66; color: #FFFFFF">
<div style="max-width: 1240px; margin: 0 auto; padding: 64px 24px">
<h1 style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: clamp(36px, 4.6vw, 54px); line-height: 1.1; margin: 0 0 12px">Colleges in Mangaluru &amp; Bengaluru</h1>
<p style="margin: 0; max-width: 640px; color: #D5DDF0; font-size: 19px">Explore our partner institutions across Karnataka's two leading education cities.</p>
</div>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 48px 24px 24px">
<form role="search" onSubmit="{{submitSearch}}" style="display: flex; gap: 10px; max-width: 700px; margin-bottom: 22px">
<div style="position: relative; flex: 1 1 auto; min-width: 0">
<label for="college-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search colleges</label>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#45506B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20 L16 16"></path></svg>
<input id="college-search" type="search" value="{{draft}}" onChange="{{onDraft}}" placeholder="Search by college, city or course (e.g. Nursing)" autocomplete="off" style="width: 100%; box-sizing: border-box; font: inherit; padding: 14px 16px 14px 48px; border: 1.5px solid #9AA6C2; border-radius: 10px; background: #FFFFFF; color: #1B2440">
</div>
<button type="submit" style="flex: none; font: inherit; font-weight: 700; background: #95001D; color: #FFFFFF; border: 0; padding: 0 26px; min-height: 48px; border-radius: 10px; cursor: pointer">Search</button>
</form>
<div role="tablist" aria-label="Filter by city" style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="font: inherit; font-weight: 700; padding: 12px 24px; border-radius: 999px; cursor: pointer; border: 2px solid #95001D; background: {{tb.bg}}; color: {{tb.fg}}">{{tb.label}}</button>
</sc-for>
</div>
</section>

<sc-if value="{{showCityInfo}}" hint-placeholder-val="{{true}}">
<section style="max-width: 1240px; margin: 0 auto; padding: 24px 24px 0">
<div style="background: #EEF3FC; border-radius: 14px; padding: 28px 32px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: center">
<div style="flex: 1 1 480px; min-width: 0"><h2 style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 30px; margin: 0 0 6px">{{city.name}}</h2><p style="margin: 0; color: #45506B">{{city.text}}</p></div>
<div style="font-weight: 700; color: #95001D">{{city.strong}}</div>
</div>
</section>
</sc-if>

<section style="max-width: 1240px; margin: 0 auto; padding: 32px 24px 88px">
<div style="margin-bottom: 16px; color: #45506B; font-size: 15px">Showing {{count}} colleges</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 22px">
<sc-for list="{{colleges}}" as="c" hint-placeholder-count="6">
<div style="border: 1px solid #E1E7F3; border-radius: 14px; overflow: hidden; box-shadow: 0 6px 20px rgba(15,42,102,0.05)">
<img src="{{c.img}}" alt="" style="display: block; width: 100%; height: 170px; object-fit: cover">
<div style="padding: 24px">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #95001D">{{c.city}}</div>
<h3 style="font-family: 'Outfit', sans-serif; font-size: 22px; margin: 4px 0 10px">{{c.name}}</h3>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px">
<sc-for list="{{c.streams}}" as="st" hint-placeholder-count="3"><span style="background: #EEF3FC; color: #0F2A66; font-size: 14px; font-weight: 600; padding: 4px 12px; border-radius: 999px">{{st}}</span></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" onClick="{{openEnquiry}}" style="font: inherit; font-weight: 700; background: #95001D; color: #FFFFFF; border: 0; padding: 11px 20px; border-radius: 6px; cursor: pointer">Enquire Now</button>
<a href="college-details.html" style="font-weight: 700; padding: 9px 18px; border-radius: 6px; border: 2px solid #95001D; text-decoration: none">View Details</a>
</div>
</div>
</div>
</sc-for>
</div>
<sc-if value="{{noResults}}" hint-placeholder-val="{{false}}">
<div style="border: 1px dashed #C9D3EA; border-radius: 14px; padding: 40px 24px; text-align: center">
<div style="font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 22px; margin-bottom: 6px">No colleges match “{{query}}”</div>
<p style="margin: 0 0 18px; color: #45506B">Try a different name, city or course, or ask us and we’ll find the right college for you.</p>
<button type="button" onClick="{{clearSearch}}" style="font: inherit; font-weight: 700; background: #FFFFFF; color: #95001D; border: 2px solid #95001D; padding: 10px 20px; border-radius: 6px; cursor: pointer">Clear search</button>
</div>
</sc-if>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 0 24px 72px">
<div style="background: #EEF3FC; border-radius: 18px; padding: 48px 40px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between">
<h2 style="flex: 1 1 480px; min-width: 0; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: clamp(26px, 3.2vw, 38px); line-height: 1.2; margin: 0">Not sure which college fits you best?</h2>
<button type="button" onClick="{{openEnquiry}}" style="font: inherit; font-weight: 700; background: #95001D; color: #FFFFFF; border: 0; padding: 16px 30px; border-radius: 6px; cursor: pointer">Book a Consultation</button>
</div>
</section>

<footer style="background: #0B1F4D; color: #C3CDE4; font-size: 16px">
<div style="max-width: 1240px; margin: 0 auto; padding: 64px 24px 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 36px">
<div>
<div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px"><img src="images/logo-mark-white.png" alt="" style="height: 40px; width: auto"><span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 20px; color: #FFFFFF; line-height: 1.15">EDUGLOBAL<br>INTERNATIONAL</span></div>
<p style="margin: 0 0 16px">Admission guidance for top colleges in Mangaluru and Bengaluru — from course selection to joining day.</p>
<div style="display: flex; gap: 16px; flex-wrap: wrap"><a href="#" style="color: #FFFFFF">Facebook</a><a href="#" style="color: #FFFFFF">Instagram</a><a href="#" style="color: #FFFFFF">YouTube</a></div>
</div>
<div>
<div style="font-weight: 700; color: #FFFFFF; margin-bottom: 12px">Useful Links</div>
<div style="display: flex; flex-direction: column; gap: 6px"><a href="index.html" style="color: #C3CDE4; text-decoration: none">Home</a><a href="colleges.html" style="color: #C3CDE4; text-decoration: none">Colleges</a><a href="courses.html" style="color: #C3CDE4; text-decoration: none">Find a Course</a><a href="about.html" style="color: #C3CDE4; text-decoration: none">About Us</a><a href="services.html" style="color: #C3CDE4; text-decoration: none">Our Services</a></div>
</div>
<div>
<div style="font-weight: 700; color: #FFFFFF; margin-bottom: 12px">Our Offices</div>
<div style="margin-bottom: 14px"><b style="color: #FFFFFF">Mangaluru</b><br>[Building, Street], [Area]<br>Mangaluru, Karnataka [PIN]</div>
<div><b style="color: #FFFFFF">Bengaluru</b><br>[Building, Street], [Area]<br>Bengaluru, Karnataka [PIN]</div>
</div>
<div>
<div style="font-weight: 700; color: #FFFFFF; margin-bottom: 12px">Help Line</div>
<div style="font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 22px"><a href="tel:+910000000000" style="color: #FFFFFF; text-decoration: none">+91 [PHONE]</a></div>
<div style="margin: 6px 0"><a href="mailto:info@example.com" style="color: #FFFFFF">[info@youragency.com]</a></div>
<div>Mon–Sat, 9:30 am – 6:30 pm</div>
</div>
</div>
<div style="border-top: 1px solid #22386B">
<div style="max-width: 1240px; margin: 0 auto; padding: 20px 24px 28px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; font-size: 14px">
<div>© 2026 Eduglobal International. All rights reserved.</div>
<div style="display: flex; gap: 20px; flex-wrap: wrap"><a href="#" style="color: #C3CDE4">Privacy Policy</a><a href="#" style="color: #C3CDE4">Terms of Use</a></div>
</div>
</div>
</footer>

<sc-if value="{{showEnquiry}}" hint-placeholder-val="{{false}}">
<div style="position: fixed; inset: 0; z-index: 50; background: rgba(11,31,77,0.6); display: flex; align-items: center; justify-content: center; padding: 16px">
<form role="dialog" aria-label="Quick enquiry" class="eg-form" style="background: #FFFFFF; border-radius: 16px; padding: 30px; width: 100%; max-width: 520px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<div style="grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center">
<h2 style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 26px; margin: 0">Quick Enquiry</h2>
<button type="button" onClick="{{closeEnquiry}}" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #C9D3EA; background: #FFFFFF; color: #1B2440; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 5 L19 19 M19 5 L5 19"></path></svg></button>
</div>
<label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 700">Name<input type="text" style="font: inherit; font-weight: 400; padding: 11px 12px; border: 1px solid #9AA6C2; border-radius: 6px"></label>
<label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 700">Phone<input type="tel" style="font: inherit; font-weight: 400; padding: 11px 12px; border: 1px solid #9AA6C2; border-radius: 6px"></label>
<label style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 700">Email<input type="email" style="font: inherit; font-weight: 400; padding: 11px 12px; border: 1px solid #9AA6C2; border-radius: 6px"></label>
<label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 700">Course<select style="font: inherit; font-weight: 400; padding: 11px 12px; border: 1px solid #9AA6C2; border-radius: 6px; background: #FFFFFF"><option>Engineering</option><option>Medical / Dental</option><option>Nursing / Allied Health</option><option>Management</option><option>Commerce / Other</option></select></label>
<label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 700">Nearest office<select style="font: inherit; font-weight: 400; padding: 11px 12px; border: 1px solid #9AA6C2; border-radius: 6px; background: #FFFFFF"><option>Mangaluru</option><option>Bengaluru</option></select></label>
<button type="button" onClick="{{closeEnquiry}}" style="grid-column: 1 / -1; font: inherit; font-weight: 700; background: #95001D; color: #FFFFFF; border: 0; border-radius: 6px; padding: 14px; cursor: pointer">Submit</button>
</form>
</div>
</sc-if>

</div>
</template>
<script src="assets/runtime.js"></script>
<script>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { city: 'all', enquiry: false }; }
renderVals() {
const all = [
{ city: 'Mangaluru', name: '[College name]', streams: ['Medical', 'Dental', 'Nursing'], img: 'images/college-1.jpg' },
{ city: 'Mangaluru', name: '[College name]', streams: ['Engineering', 'Management'], img: 'images/college-2.jpg' },
{ city: 'Mangaluru', name: '[College name]', streams: ['Pharmacy', 'Allied Health'], img: 'images/college-3.jpg' },
{ city: 'Bengaluru', name: '[College name]', streams: ['Engineering', 'Architecture'], img: 'images/college-2.jpg' },
{ city: 'Bengaluru', name: '[College name]', streams: ['Management', 'Commerce'], img: 'images/college-3.jpg' },
{ city: 'Bengaluru', name: '[College name]', streams: ['Medical', 'Nursing'], img: 'images/college-1.jpg' }
];
const info = {
Mangaluru: { name: 'Mangaluru', text: 'Coastal Karnataka’s education hub, home to well-established medical, dental, nursing, pharmacy and engineering institutions.', strong: 'Strong in: Medical · Nursing · Engineering' },
Bengaluru: { name: 'Bengaluru', text: 'India’s technology capital, with a wide choice of engineering, management, design and commerce colleges and strong industry links.', strong: 'Strong in: Engineering · Management · Commerce' }
};
const c = this.state.city;
const q = this.state.q || '';
const needle = q.trim().toLowerCase();
const list = all.filter(x => (c === 'all' || x.city === c) && (!needle || [x.name, x.city].concat(x.streams).join(' ').toLowerCase().indexOf(needle) !== -1));
const opts = [{ id: 'all', label: 'All Colleges' }, { id: 'Mangaluru', label: 'Mangaluru' }, { id: 'Bengaluru', label: 'Bengaluru' }];
return {
tabs: opts.map(o => ({ label: o.label, sel: o.id === c ? 'true' : 'false', bg: o.id === c ? '#95001D' : '#FFFFFF', fg: o.id === c ? '#FFFFFF' : '#95001D', pick: () => this.setState({ city: o.id }) })),
showCityInfo: c !== 'all',
city: info[c] || info.Mangaluru,
colleges: list,
count: list.length,
noResults: list.length === 0,
query: q,
draft: this.state.draft == null ? q : this.state.draft,
onDraft: (e) => this.setState({ draft: e.target.value }),
submitSearch: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ q: this.state.draft == null ? q : this.state.draft }); },
clearSearch: () => this.setState({ q: '', draft: '', city: 'all' }),
showMenu: !!this.state.menu,
menuExpanded: this.state.menu ? 'true' : 'false',
toggleMenu: () => this.setState({ menu: !this.state.menu }),
showEnquiry: this.state.enquiry,
openEnquiry: () => this.setState({ enquiry: true, menu: false }),
closeEnquiry: () => this.setState({ enquiry: false })
};
}
}
EG.mount(Component);
</script>
</body>
</html>

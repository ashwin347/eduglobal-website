<section style="background: #0F2A66; color: #FFFFFF">

</div>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 22px">
<sc-for list="{{services}}" as="s" hint-placeholder-count="6">

<div style="flex: none; width: 64px; height: 64px; border-radius: 14px; background: #95001D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 22px">{{s.n}}</div>
<div style="flex: 999 1 360px; min-width: 0">
<h2 style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 26px; margin: 0 0 8px">{{s.t}}</h2>
<p style="margin: 0 0 14px; color: #45506B">{{s.d}}</p>
<ul style="margin: 0; padding-left: 20px; color: #1B2440; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 24px">
<sc-for list="{{s.points}}" as="p" hint-placeholder-count="3"><li>{{p}}</li></sc-for>
</ul>
</div>
<button type="button" onClick="{{openEnquiry}}" style="flex: none; font: inherit; font-weight: 700; background: #FFFFFF; color: #95001D; border: 2px solid #95001D; padding: 10px 20px; border-radius: 6px; cursor: pointer">Enquire</button>
</div>
</sc-for>
</section>

<section style="background: #F6F8FC">
<div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px">
<div style="text-align: center; max-width: 700px; margin: 0 auto 44px">

</div>

<h3 style="font-family: 'Outfit', sans-serif; font-size: 22px; margin: 12px 0 6px">{{p.t}}</h3>
<p style="margin: 0; font-size: 16px; color: #45506B">{{p.d}}</p>
</div>
</sc-for>
</div>
</div>
</section>

<section style="max-width: 900px; margin: 0 auto; padding: 88px 24px">
<h2 style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: clamp(30px, 3.8vw, 44px); line-height: 1.15; margin: 0 0 28px; text-align: center">Frequently Asked Questions</h2>

<details style="border: 1px solid #E1E7F3; border-radius: 12px; padding: 16px 22px; margin-bottom: 12px">
<summary style="font-weight: 700; font-size: 18px; cursor: pointer">{{f.q}}</summary>
<p style="margin: 10px 0 0; color: #45506B">{{f.a}}</p>
</details>
</sc-for>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 0 24px 72px">
<div style="background: #EEF3FC; border-radius: 18px; padding: 48px 40px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between">
<h2 style="flex: 1 1 480px; min-width: 0; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: clamp(26px, 3.2vw, 38px); line-height: 1.2; margin: 0">Let's start with a free consultation.</h2>
<button type="button" onClick="{{openEnquiry}}" style="font: inherit; font-weight: 700; background: #95001D; color: #FFFFFF; border: 0; padding: 16px 30px; border-radius: 6px; cursor: pointer">Book a Consultation</button>

<footer style="background: #0B1F4D; color: #C3CDE4; font-size: 16px">

</div>
<div>

<div style="display: flex; flex-direction: column; gap: 6px"><a href="index.html" style="color: #C3CDE4; text-decoration: none">Home</a><a href="colleges.html" style="color: #C3CDE4; text-decoration: none">Colleges</a><a href="courses.html" style="color: #C3CDE4; text-decoration: none">Find a Course</a><a href="about.html" style="color: #C3CDE4; text-decoration: none">About Us</a><a href="services.html" style="color: #C3CDE4; text-decoration: none">Our Services</a></div>
</div>

<div style="font-weight: 700; color: #FFFFFF; margin-bottom: 12px">Our Offices</div>
<div style="margin-bottom: 14px"><b style="color: #FFFFFF">Mangaluru</b><br>[Building, Street], [Area]<br>Mangaluru, Karnataka [PIN]</div>
<div><b style="color: #FFFFFF">Bengaluru</b><br>[Building, Street], [Area]<br>Bengaluru, Karnataka [PIN]</div>
</div>
<div>
<div style="font-weight: 700; color: #FFFFFF; margin-bottom: 12px">Help Line</div>
<div style="font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 22px"><a href="tel:+910000000000" style="color: #FFFFFF; text-decoration: none">+91 [PHONE]</a></div>

<sc-if value="{{showEnquiry}}" hint-placeholder-val="{{false}}">

</div>
<label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 700">Name<input type="text" style="font: inherit; font-weight: 400; padding: 11px 12px; border: 1px solid #9AA6C2; border-radius: 6px"></label>
<label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 700">Phone<input type="tel" style="font: inherit; font-weight: 400; padding: 11px 12px; border: 1px solid #9AA6C2; border-radius: 6px"></label>
<label style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 700">Email<input type="email" style="font: inherit; font-weight: 400; padding: 11px 12px; border: 1px solid #9AA6C2; border-radius: 6px"></label>
<label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 700">Course<select style="font: inherit; font-weight: 400; padding: 11px 12px; border: 1px solid #9AA6C2; border-radius: 6px; background: #FFFFFF"><option>Engineering</option><option>Medical / Dental</option><option>Nursing / Allied Health</option><option>Management</option><option>Commerce / Other</option></select></label>
<label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 700">Nearest office<select style="font: inherit; font-weight: 400; padding: 11px 12px; border: 1px solid #9AA6C2; border-radius: 6px; background: #FFFFFF"><option>Mangaluru</option><option>Bengaluru</option></select></label>
<button type="button" onClick="{{closeEnquiry}}" style="grid-column: 1 / -1; font: inherit; font-weight: 700; background: #95001D; color: #FFFFFF; border: 0; border-radius: 6px; padding: 14px; cursor: pointer">Submit</button>
</form>

<script src="assets/runtime.js"></script>
<script>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { enquiry: false }; }
renderVals() {
return {
services: [
{ n: '01', t: 'Career Counselling', d: 'One-to-one sessions that match a student’s strengths, interests and goals to the right program.', points: ['Stream and course selection', 'Career path discussion with parents', 'Realistic options based on results'] },
{ n: '02', t: 'College Shortlisting', d: 'A personalised shortlist of colleges in Mangaluru and Bengaluru that fit your marks, ranks and budget.', points: ['Fee and hostel comparison', 'Placement and accreditation review', 'Campus visit planning'] },
{ n: '03', t: 'Application Management', d: 'We prepare and track every application so nothing is missed.', points: ['Form filling and document checks', 'Deadline tracking', 'Follow-up with colleges'] },
{ n: '04', t: 'Counselling-Round Guidance', d: 'Support through state and national seat-allotment processes.', points: ['KCET, COMEDK and KEA rounds', 'NEET-UG counselling', 'Option entry and seat confirmation'] },
{ n: '05', t: 'Scholarships & Education Loans', d: 'Guidance on financial support so cost doesn’t stand in the way.', points: ['Scholarship eligibility checks', 'Loan documentation support', 'Fee payment planning'] },
{ n: '06', t: 'Hostel & Relocation', d: 'Help settling in so students can focus on their studies from day one.', points: ['Hostel and PG options', 'Local orientation', 'Joining-day support'] }
],
steps: [
{ n: '01', t: 'Consult', d: 'A free session to understand your results, goals and options.' },
{ n: '02', t: 'Shortlist', d: 'Best-fit colleges with fees, cut-offs and timelines.' },
{ n: '03', t: 'Apply', d: 'We manage applications, counselling rounds and confirmations.' },
{ n: '04', t: 'Join', d: 'Hostel, travel and first-week support until classes begin.' }
],
faqs: [
{ q: 'Is the first consultation free?', a: 'Yes. The first counselling session is free with no obligation.' },
{ q: 'Do you help with counselling rounds?', a: 'Yes — we guide students through KCET, COMEDK, KEA and NEET-UG seat-allotment rounds.' },
{ q: 'Which colleges do you work with?', a: '[Describe your partner colleges in Mangaluru and Bengaluru.]' },
{ q: 'Do you support students from outside Karnataka?', a: 'Yes, we support students from across India.' },
{ q: 'What are your fees?', a: '[State your fee structure here.]' }
],
showMenu: !!this.state.menu,
menuExpanded: this.state.menu ? 'true' : 'false',
toggleMenu: () => this.setState({ menu: !this.state.menu }),
showEnquiry: this.state.enquiry,
openEnquiry: () => this.setState({ enquiry: true, menu: false }),
closeEnquiry: () => this.setState({ enquiry: false })
};
}
}
EG.mount(Component);
</script>
</body>
